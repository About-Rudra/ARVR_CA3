name: validate-integration

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DEV4 integration check (no Unity required)
        shell: pwsh
        run: ./tests/validate_integration.ps1
      - name: JSON sanity (manifest + seed if present)
        run: |
          python3 -c "import json; json.load(open('Packages/manifest.json')); print('manifest.json: valid')"
          python3 -c "import json; d=json.load(open('Assets/Resources/seed_assets.json')); a=d.get('assets',[]); assert len(a)==5, len(a); print('seed_assets.json: valid, 5 assets')"
      - name: Frontend syntax check (no browser needed)
        run: |
          node --check frontend/ar/app.js && node --check frontend/ar/config.js && node --check frontend/dashboard/app.js && node --check frontend/dashboard/config.js && echo "frontend JS: syntax OK"
      - name: Backend lint/test (if DEV2 landed)
        working-directory: Backend
        run: |
          if [ -f package.json ]; then npm ci --no-audit --no-fund; npm test --if-present; else echo "Backend/ not landed yet (DEV2) — skipped"; fi
